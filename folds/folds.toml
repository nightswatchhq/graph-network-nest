[[fold]]
name = "latest_obs"
key = "singleton"
carry = ["block_number UBIGINT", "log_index UBIGINT", "epoch BIGINT"]
max_rows = 1

[[fold]]
name = "persisted"
key = "singleton"
carry = ["block_number UBIGINT", "log_index UBIGINT", "l1_block BIGINT"]
max_rows = 1

[[fold]]
name = "pause"
key = ["kind"]
carry = ["kind VARCHAR", "block_number UBIGINT", "log_index UBIGINT", "value BOOLEAN"]
